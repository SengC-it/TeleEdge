<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeleEdge · Forward Validation</title>
<style>body{font-family:system-ui;background:#080d18;color:#e8eefc;margin:0;padding:32px}main{max-width:900px;margin:auto}.card{border:1px solid #263650;border-radius:16px;padding:22px;margin:14px 0;background:#101827}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:#91a3bf}.value{font-size:25px;margin-top:8px}code{color:#9fe6c4}</style></head>
<body><main><p class="muted">TELEEDGE · FROZEN FORWARD VALIDATION</p><h1>Forward Validation</h1><div class="card"><div class="muted">Run status</div><div id="status" class="value">Loading…</div><p id="note" class="muted">System-paper results are separate from manual decisions. A run remains PREPARED until explicitly activated.</p></div><div class="grid"><div class="card"><div class="muted">Days</div><div id="days" class="value">—</div></div><div class="card"><div class="muted">Independent signals</div><div id="signals" class="value">—</div></div><div class="card"><div class="muted">V7.5 / V8 / combined</div><div id="counts" class="value">—</div></div><div class="card"><div class="muted">Closed / open</div><div id="closed" class="value">—</div></div></div><div class="card"><div class="muted">Strategy fingerprints</div><p id="hashes"><code>Not loaded</code></p></div></main>
<script>const el=id=>document.getElementById(id);const metric=(rows,p)=>rows.filter(p).length;async function load(){try{const r=await fetch('/api/forward-validation',{cache:'no-store'});const p=await r.json();if(!r.ok||!p.ok)throw Error(p.error||'unavailable');const run=p.run;if(!run){el('status').textContent='PREPARED · no run created';return}const start=run.started_at?new Date(run.started_at):null;const days=start?Math.max(0,(Date.now()-start)/86400000).toFixed(1):'0';const m=p.metrics||{};el('status').textContent=run.status;el('days').textContent=days+' / 90';el('signals').textContent=(p.signals||[]).filter(x=>x.origin==='forward-validation'&&x.data_quality_status!=='INVALID_SIGNAL_DATA').length+' / 50';el('counts').textContent=`${metric(p.signals||[],x=>x.strategy==='V7.5')} / ${metric(p.signals||[],x=>x.strategy==='V8')} / ${new Set((p.signals||[]).map(x=>x.independent_id||x.overlap_group_id)).size}`;el('closed').textContent=`${(p.outcomes||[]).filter(x=>x.status==='closed').length} / ${(p.outcomes||[]).filter(x=>x.status!=='closed').length}`;el('hashes').textContent=`V7.5 ${run.v75_strategy_sha256||'—'} · V8 ${run.v8_strategy_sha256||'—'} · PF ${m.profitFactor??'—'} · expectancy ${m.expectancyR??'—'}R`}catch(e){el('status').textContent='ADMIN AUTH REQUIRED';el('note').textContent='This research/admin page does not contain a token. Use the authenticated admin API contract.'}}load();</script></body></html>
